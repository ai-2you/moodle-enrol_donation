name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        moodle-branch: ['MOODLE_405_STABLE']
        database: [pgsql, mariadb]

    steps:
      - name: Check out repository code
        # v6.1.0 (v6 tag currently resolves to the same commit)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: plugin
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        # v2.37.2 (v2 tag currently resolves to the same commit)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Install es/id language packs for PHPUnit locale tests
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          # ci/.env is written by `moodle-plugin-ci install` and re-read by every later
          # moodle-plugin-ci invocation (see moodlehq/moodle-plugin-ci bin/moodle-plugin-ci),
          # so sourcing it gives us the real Moodle checkout path with no guessing.
          . ci/.env

          BRANCH_CODE=$(grep -E "branch[[:space:]]*=[[:space:]]*'" "$MOODLE_DIR/version.php" | grep -oE '[0-9]+' | head -1)
          MOODLE_VERSION="${BRANCH_CODE:0:1}.$((10#${BRANCH_CODE:1}))"

          PHPU_DATAROOT=$(grep -oP "phpunit_dataroot\s*=\s*'\K[^']+" "$MOODLE_DIR/config.php")
          mkdir -p "$PHPU_DATAROOT/lang"

          for LANG in es id; do
            curl -sSfL -o "/tmp/${LANG}.zip" "https://download.moodle.org/download.php/langpack/${MOODLE_VERSION}/${LANG}.zip"
            unzip -q -o "/tmp/${LANG}.zip" -d "$PHPU_DATAROOT/lang"
          done

          # Moodle wipes phpunit_dataroot at bootstrap and again after every
          # resetAfterTest() (lib/phpunit/classes/util.php reset_dataroot()), except
          # entries listed in originaldatafiles.json. Add "lang" there so the installed
          # packs survive the whole PHPUnit run instead of being deleted before use.
          php -r '
            $f = $argv[1];
            $list = file_exists($f) ? json_decode(file_get_contents($f), true) : [];
            if (!is_array($list)) { $list = []; }
            if (!in_array("lang", $list, true)) { $list[] = "lang"; }
            file_put_contents($f, json_encode($list));
          ' "$PHPU_DATAROOT/originaldatafiles.json"

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning --fail-on-skipped

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        # v7.0.1 (v7 tag currently resolves to the same commit)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed
        if: ${{ cancelled() }}
        run: exit 1
